[project]
name = "smartwatch-llm-service"
version = "0.1.0"
description = "Backend service for processing smartwatch screenshots using multimodal LLMs via FastAPI and gRPC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "pydantic>=2.10.0",
    "pillow>=11.0.0",
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "python-multipart>=0.0.17",
    "lightning>=2.4.0",
    "accelerate>=1.2.0",
    "gradio>=5.0.0",
    "requests>=2.32.0",
    "ollama>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
